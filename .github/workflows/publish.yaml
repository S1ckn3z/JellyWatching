name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.JellyWatching/Jellyfin.Plugin.JellyWatching.csproj -c Release -o ./release --no-restore

      - name: Create ZIP
        run: |
          cd release
          zip -j ../jellywatching_${{ github.event.release.tag_name || 'manual' }}.zip Jellyfin.Plugin.JellyWatching.dll

      - name: Calculate MD5
        run: |
          md5sum jellywatching_${{ github.event.release.tag_name || 'manual' }}.zip > jellywatching_${{ github.event.release.tag_name || 'manual' }}.zip.md5

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jellywatching_${{ github.event.release.tag_name }}.zip
            jellywatching_${{ github.event.release.tag_name }}.zip.md5

  manifest:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Manifest
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.3.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pagesBranch: gh-pages
          pagesFile: manifest.json
