overview: "Are you still watching? Pauses playback after consecutive episodes."
description: >
  JellyWatching monitors consecutive episode playback per user and device.
  After a configurable number of episodes, it pauses playback and displays
  a confirmation message, similar to the Netflix 'Are you still watching?' feature.
  Supports flexible thresholds, night mode, per-user overrides, and activity detection.
